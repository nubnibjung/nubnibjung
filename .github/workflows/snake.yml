name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *" # รันทุก 12 ชั่วโมง
  workflow_dispatch: # กดรันเองได้
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake from contributions
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=e0407f&color_dots=ffe9f3,ffc2de,ff9ecd,ff7eb6,e0407f
            dist/github-snake-dark.svg?palette=github-dark&color_snake=ff7eb6&color_dots=2a1622,6b1d47,b03a76,ff7eb6,ffc2de

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
