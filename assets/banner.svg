<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Pidchanard Mueanson - nubnibjung" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="round"><rect width="1000" height="280" rx="22"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d0a1f"/>
      <stop offset="0.55" stop-color="#6b1d47"/>
      <stop offset="1" stop-color="#b03a76"/>
    </linearGradient>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="500" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#ff9ecd"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ff9ecd"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="500 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="star" d="M0 -9 L2.2 -2.2 L9 0 L2.2 2.2 L0 9 L-2.2 2.2 L-9 0 L-2.2 -2.2Z"/>
  </defs>
  <style>
    .fl{fill:#ffc2de;opacity:0;font-family:Arial,sans-serif;animation:fl 7s ease-in infinite}
    @keyframes fl{0%{transform:translateY(0) scale(.5);opacity:0}15%{opacity:.85}100%{transform:translateY(-250px) scale(1.3);opacity:0}}
    .tw{fill:#fff;transform-box:fill-box;transform-origin:center;animation:tw 2.6s ease-in-out infinite}
    @keyframes tw{0%,100%{transform:scale(.25);opacity:.15}50%{transform:scale(1);opacity:1}}
    .fade{opacity:0;animation:fade 1.4s ease-out 0.4s forwards}
    .fade2{opacity:0;animation:fade 1.4s ease-out 1s forwards}
    @keyframes fade{to{opacity:1}}
    .pulse{animation:pulse 3s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.75}50%{opacity:1}}
  </style>

  <g clip-path="url(#round)">
    <rect width="1000" height="280" fill="url(#bg)"/>

    <!-- twinkling stars -->
    <g>
      <use href="#star" class="tw" x="90"  y="55"  style="animation-delay:0s"/>
      <use href="#star" class="tw" x="230" y="35"  style="animation-delay:.7s"/>
      <use href="#star" class="tw" x="360" y="80"  style="animation-delay:1.4s"/>
      <use href="#star" class="tw" x="640" y="40"  style="animation-delay:.3s"/>
      <use href="#star" class="tw" x="780" y="75"  style="animation-delay:1.1s"/>
      <use href="#star" class="tw" x="905" y="45"  style="animation-delay:1.8s"/>
      <use href="#star" class="tw" x="150" y="150" style="animation-delay:2s"/>
      <use href="#star" class="tw" x="860" y="150" style="animation-delay:.5s"/>
    </g>

    <!-- floating hearts -->
    <g>
      <text class="fl" x="60"  y="270" font-size="22" style="animation-delay:0s">♥</text>
      <text class="fl" x="190" y="270" font-size="16" style="animation-delay:2.2s">♥</text>
      <text class="fl" x="330" y="270" font-size="26" style="animation-delay:4.1s">♥</text>
      <text class="fl" x="470" y="270" font-size="14" style="animation-delay:1.2s">♥</text>
      <text class="fl" x="610" y="270" font-size="24" style="animation-delay:3.3s">♥</text>
      <text class="fl" x="750" y="270" font-size="18" style="animation-delay:5.2s">♥</text>
      <text class="fl" x="880" y="270" font-size="24" style="animation-delay:.9s">♥</text>
      <text class="fl" x="940" y="270" font-size="14" style="animation-delay:3.9s">♥</text>
    </g>

    <!-- title -->
    <g filter="url(#glow)" class="pulse">
      <text x="500" y="128" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="54" font-weight="800" letter-spacing="3" textLength="820" lengthAdjust="spacing" fill="url(#shine)">PIDCHANARD MUEANSON</text>
    </g>
    <text class="fade" x="500" y="172" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#ffc2de">✦  nubnibjung  ✦  Full-Stack Developer in the making  ✦</text>
    <text class="fade2" x="500" y="202" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#ffd9ea" letter-spacing="2">KASETSART UNIVERSITY</text>

    <!-- waves -->
    <path fill="#ff7eb6" fill-opacity=".22" d="M0 232 Q125 202 250 232 T500 232 T750 232 T1000 232 T1250 232 T1500 232 T1750 232 T2000 232 V280 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path fill="#ff9ecd" fill-opacity=".28" d="M0 246 Q125 222 250 246 T500 246 T750 246 T1000 246 T1250 246 T1500 246 T1750 246 T2000 246 V280 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="6.5s" repeatCount="indefinite"/>
    </path>
    <path fill="#ffc2de" fill-opacity=".35" d="M0 258 Q125 240 250 258 T500 258 T750 258 T1000 258 T1250 258 T1500 258 T1750 258 T2000 258 V280 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="4.5s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
