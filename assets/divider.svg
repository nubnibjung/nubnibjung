<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 28" width="1000" height="28" role="img" aria-label="divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7eb6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff7eb6"/>
      <stop offset="1" stop-color="#ff7eb6" stop-opacity="0"/>
    </linearGradient>
    <path id="star" d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2Z"/>
  </defs>
  <style>
    .tw{fill:#ffc2de;transform-box:fill-box;transform-origin:center;animation:tw 2s ease-in-out infinite}
    @keyframes tw{0%,100%{transform:scale(.4);opacity:.4}50%{transform:scale(1.1);opacity:1}}
    .h{fill:#ff7eb6;font-family:Arial,sans-serif;font-size:14px;animation:b 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes b{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
  </style>
  <rect x="0" y="13" width="1000" height="2" fill="url(#line)"/>
  <!-- traveling light -->
  <circle r="3.5" cy="14" fill="#fff">
    <animate attributeName="cx" values="0;1000" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle r="3.5" cy="14" fill="#ffc2de">
    <animate attributeName="cx" values="1000;0" dur="5.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="5.5s" repeatCount="indefinite"/>
  </circle>
  <use href="#star" class="tw" x="400" y="14" style="animation-delay:0s"/>
  <use href="#star" class="tw" x="600" y="14" style="animation-delay:1s"/>
  <text class="h" x="494" y="19">♥</text>
</svg>
